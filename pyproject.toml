[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snake-game"
version = "1.1.0"
description = "A pygame Snake game with a pure, unit-tested rules engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Priyanshu Kumar" }]
keywords = ["snake", "pygame", "game", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: SDL",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
snake-game = "snake_game.__main__:main"

[project.urls]
Homepage = "https://github.com/priyanshkk/snake-game"
Repository = "https://github.com/priyanshkk/snake-game"
Issues = "https://github.com/priyanshkk/snake-game/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snake_game"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
